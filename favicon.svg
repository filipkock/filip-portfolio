<!-- The lattice is the drawing; the F is only which cells happen to be inked,
     and the pointer red sits in the bottom right cell. One cell subdivides
     again, the way the engine's quadtree does. The lattice is held off the
     frame so the letter never fuses with it, and it is drawn in gray so the
     ink reads as figure. Edges sit on even coordinates of the 32 grid so
     shapes land on whole pixels at 16px instead of going gray. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#fafafa"/>
  <path d="M2 2h28v28H2z M4 4h24v24H4z" fill="#111111" fill-rule="evenodd"/>
  <g fill="none" stroke="#9c9c9c" stroke-width="1">
    <path d="M8 8h16v16H8z"/>
    <path d="M12 8v16M16 8v16M20 8v16M8 12h16M8 16h16M8 20h16"/>
    <path d="M18 12v4M16 14h4"/>
  </g>
  <path d="M8 8h12v4H12v4h4v4h-4v4H8z" fill="#111111"/>
  <circle cx="22" cy="22" r="2" fill="#d71921"/>
</svg>
