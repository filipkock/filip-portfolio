<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CONCEPT C · INDEX + PREVIEW · 01 WORK</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.className += ' js';</script>
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script defer src="../js/grid-engine.js"></script>
  <script defer src="../js/site.js"></script>
  <style>
    .concept-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      border-bottom: var(--hair) solid var(--ink);
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-xs);
      letter-spacing: var(--track-wide);
      text-transform: uppercase;
    }
    .concept-bar a { text-decoration: none; padding: var(--space-1) var(--space-2); }
    .concept-bar a:hover, .concept-bar a[aria-current="true"] { background: var(--ink); color: var(--paper); }
    .concept-bar .set { display: flex; gap: var(--space-1); }

    .split { grid-template-columns: 5fr 4fr; }
    .list { background: var(--paper); align-content: start; }
    .list > a { border-bottom: var(--hair) solid var(--ink); }
    .c-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr auto;
      align-items: baseline;
      gap: var(--space-3);
      padding: var(--space-3);
      text-decoration: none;
      color: var(--ink);
    }
    .c-row h2 { font-size: var(--text-m); }
    .c-row .year { color: var(--gray-3); font-size: var(--text-xs); letter-spacing: var(--track-wide); }
    .c-row:hover, .c-row.is-current, .c-row:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
    .c-row:hover .idx, .c-row.is-current .idx, .c-row:focus-visible .idx,
    .c-row:hover .year, .c-row.is-current .year, .c-row:focus-visible .year { color: var(--gray-2); }

    .preview { position: sticky; top: var(--space-3); display: flex; flex-direction: column; }
    .preview .thumb { aspect-ratio: 4 / 3; border-bottom: var(--hair) solid var(--ink); }
    .preview .info { padding: var(--space-3); }
    .preview .info h2 { display: inline; font-size: var(--text-m); }
    .preview .info .desc { margin-top: var(--space-2); font-size: var(--text-s); }
    .preview .info .tags { margin-top: var(--space-2); color: var(--gray-3); }
    @media (max-width: 700px) {
      .split { grid-template-columns: 1fr; }
      .preview { display: none; }
    }
  </style>
</head>
<body class="page-work">
  <header class="concept-bar">
    <a href="../index.html">← INDEX</a>
    <span>01 WORK · CONCEPT C · INDEX + PREVIEW</span>
    <span class="set">
      <a href="work-a.html">A</a>
      <a href="work-b.html">B</a>
      <a href="work-c.html" aria-current="true">C</a>
      <a href="work-d.html">D</a>
    </span>
  </header>

  <main class="wrap">
    <div class="title-row">
      <h1>01 WORK</h1>
      <p class="label count">6 PROJECTS</p>
    </div>

    <div class="hairline-grid split">
      <nav class="list" aria-label="Projects"></nav>
      <aside class="preview" aria-live="polite">
        <div class="thumb" id="preview-canvas" aria-hidden="true"></div>
        <div class="info">
          <p class="idx" id="pv-idx">P-01</p>
          <h2 id="pv-title">CLINIC SCHEDULING SYSTEM</h2>
          <p class="desc" id="pv-desc"></p>
          <p class="tags label" id="pv-tags"></p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    // concept mockup: list renders from data; hovering (or focusing) a row
    // re-seeds the single preview instance - deterministic per project
    window.addEventListener('DOMContentLoaded', function () {
      var PROJECTS = [
        { idx: 'P-01', title: 'CLINIC SCHEDULING SYSTEM', desc: 'Rebuilt the calendar core so clinics plan weeks, not days.', tags: 'PRODUCT · SERVICE DESIGN · 2025', seed: 1101, variant: 'quadtree' },
        { idx: 'P-02', title: 'PATIENT JOURNAL UX', desc: 'Faster clinical notes with structured templates and review states.', tags: 'PRODUCT · RESEARCH · 2025', seed: 1102, variant: 'flow' },
        { idx: 'P-03', title: 'DESIGN TOKEN PIPELINE', desc: 'One source of truth from Figma variables to shipped CSS.', tags: 'SYSTEMS · TOOLING · 2024', seed: 1103, variant: 'blocks' },
        { idx: 'P-04', title: 'BOOKING FLOW REBUILD', desc: 'Cut patient booking from six steps to three.', tags: 'PRODUCT · UX · 2024', seed: 1104, variant: 'dither' },
        { idx: 'P-05', title: 'CLINICAL DATA DASHBOARD', desc: 'Treatment outcomes, visualized for practitioners, not analysts.', tags: 'DATA VIZ · FRONTEND · 2023', seed: 1105, variant: 'field' },
        { idx: 'P-06', title: 'ONBOARDING EXPERIMENTS', desc: 'Growth experiments that doubled trial activation.', tags: 'GROWTH · PROTOTYPING · 2023', seed: 1106, variant: 'quadtree' }
      ];
      var list = document.querySelector('.list');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var sketch = null;
      function makePreview(pr) {
        // variant is baked into an instance's tune, so swap = fresh instance
        if (sketch) { sketch.destroy(); sketch = null; }
        try {
          sketch = window.createGridSketch(document.getElementById('preview-canvas'), {
            mode: 'card', seed: pr.seed, variant: pr.variant, animate: 'hover', reducedMotion: reduced
          });
        } catch (e) { /* preview cell stays paper */ }
      }

      var current = -1;
      function select(i) {
        if (i === current) return;
        current = i;
        var pr = PROJECTS[i];
        document.getElementById('pv-idx').textContent = pr.idx;
        document.getElementById('pv-title').textContent = pr.title;
        document.getElementById('pv-desc').textContent = pr.desc;
        document.getElementById('pv-tags').textContent = pr.tags;
        list.querySelectorAll('.c-row').forEach(function (r, j) { r.classList.toggle('is-current', j === i); });
        makePreview(pr);
      }

      PROJECTS.forEach(function (pr, i) {
        var a = document.createElement('a');
        a.className = 'c-row';
        a.href = '#';
        a.innerHTML = '<span class="idx">' + pr.idx + '</span><h2>' + pr.title + '</h2><span class="year">' + pr.tags.split('·').pop().trim() + '</span>';
        a.addEventListener('pointerenter', function () { select(i); });
        a.addEventListener('focus', function () { select(i); });
        list.appendChild(a);
      });
      select(0);
    });
  </script>
</body>
</html>
