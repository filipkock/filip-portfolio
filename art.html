    document.documentElement.className += ' js';
    // arriving from a mold exit: start black, the engine retreats it.

        document.documentElement.className += ' arriving';
        setTimeout(function () { document.documentElement.classList.remove('arriving'); }, 1500);
      }

    <!-- THE SPOTS: side quests hiding in the artwork, the about page's
         photo-cell pattern. Hover reveals the piece and the red cursor dot
         becomes its caption (data-cursor); a crop tick marks each cell.

         Each spot is one overlay div + one <a> pointing at where the piece
         lives (Instagram, a shop, a repo). Clicking opens it in a new tab,
         and js/interactions.js appends a ↗ to the caption to say so.

         To fill in a placeholder:
         1. drop the image into assets/img/art/ and add inside .photo-reveal:
              <img src="assets/img/art/a-01.jpg" alt="" loading="lazy" style="--crop: 35%">
            (--crop = vertical anchor of the cover-crop, tune per image)
            or, for a clip, a <video> with a poster beside it in assets/img/art/:
              <video src="assets/video/side-quests/a-01.mp4"
                     poster="assets/img/art/a-01-poster.jpg"
                     muted loop playsinline preload="none" style="--crop: 50%"></video>
            js/art.js plays it on hover; add data-sound if it should be heard
            (the browser only allows that once the reader has clicked once).
            Web-size the file first: these live at a few hundred KB, not tens
            of MB, and export to a DIFFERENT filename than the source - .mp4
            and .MP4 are the same file on a Mac, and ffmpeg will eat the input.
         2. write the real data-cursor caption (this is the tooltip)
         3. for an <a> spot, set the real href + aria-label
         4. new spots also need a lattice span in js/art.js (SPOTS list)  -->

    <div class="grid-cell-overlay photo-overlay" data-cell="art-1">
      <a class="photo-cell" href="https://www.instagram.com/itsfilee/p/DZhTkobADn7/" target="_blank" rel="noopener"
         data-cursor="Progress of my first marble sculpture"
         aria-label="A-01, progress of my first marble sculpture, opens in a new tab">
        <span class="photo-reveal" aria-hidden="true">
          <span class="ph-label">A-01</span>
          <img src="assets/img/art/marble.jpg" alt="" loading="lazy" style="--crop: 35%">
        </span>
      </a>
    </div>

    <div class="grid-cell-overlay photo-overlay" data-cell="art-2">
      <a class="photo-cell" href="https://filipkock.github.io/p5.js-flower-reveal/" target="_blank" rel="noopener"
         data-cursor="Playing around with p5.js"
         aria-label="A-02, playing around with p5.js, opens in a new tab">
        <span class="photo-reveal" aria-hidden="true">
          <span class="ph-label">A-02</span>
          <video src="assets/video/side-quests/flower-reveal-web.mp4"
                 poster="assets/img/art/flower-reveal-poster.jpg"
                 muted loop playsinline preload="none" style="--crop: 50%"></video>
        </span>
      </a>
    </div>

    <div class="grid-cell-overlay photo-overlay" data-cell="art-3">
      <a class="photo-cell" href="https://www.instagram.com/itsfilee/p/DZhTc1PAN5A/?img_index=1" target="_blank" rel="noopener"
         data-cursor="Noise, drawn in ASCII"
         aria-label="A-03, noise drawn in ASCII, opens in a new tab">
        <span class="photo-reveal" aria-hidden="true">
          <span class="ph-label">A-03</span>
          <video src="assets/video/side-quests/noise-web.mp4"
                 poster="assets/img/art/noise-poster.jpg"
                 muted loop playsinline preload="none" style="--crop: 50%"></video>
        </span>
      </a>
    </div>

    <!-- the big spot, and one of the two that carry sound: the clip tries for
         sound on hover, and the click belongs to the link (see js/art.js) -->
    <div class="grid-cell-overlay photo-overlay" data-cell="art-4">
      <a class="photo-cell" href="https://www.instagram.com/itsfilee/reel/DZi4PWqsl4Y/" target="_blank" rel="noopener"
         data-cursor="An oscillator, built in p5.js"
         aria-label="A-04, an oscillator built in p5.js, opens in a new tab">

          <video src="assets/video/side-quests/p5-oscillator-lite.mp4"

                 data-sound muted loop playsinline preload="none" style="--crop: 50%"></video>
        </span>

    </div>

    <div class="grid-cell-overlay photo-overlay" data-cell="art-5">
